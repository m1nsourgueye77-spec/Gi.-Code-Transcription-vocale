<!DOCTYPE html>
<html lang="fr">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Gi.Code – Dictée vocale</title>
  <link rel="icon" href="https://i.ibb.co/27xRzqTQ/logo.png" />
  <script src="https://cdnjs.cloudflare.com/ajax/libs/jspdf/2.5.1/jspdf.umd.min.js"></script>
  <style>
    body {
      font-family: "Segoe UI", sans-serif;
      background: linear-gradient(135deg, #e9f0f7, #f5f7fa);
      margin: 0;
      padding: 0;
      display: flex;
      flex-direction: column;
      align-items: center;
      height: 100vh;
    }

    header {
      width: 100%;
      background: #0078d4;
      color: white;
      display: flex;
      align-items: center;
      justify-content: space-between;
      padding: 10px 40px;
      box-shadow: 0 4px 10px rgba(0,0,0,0.1);
    }

    header img {
      height: 50px;
      border-radius: 10px;
    }

    header h1 {
      font-size: 22px;
      font-weight: 600;
    }

    textarea {
      width: 85%;
      height: 400px;
      font-size: 18px;
      margin-top: 40px;
      border-radius: 12px;
      border: 2px solid #0078d4;
      padding: 15px;
      resize: none;
      outline: none;
      box-shadow: 0 4px 8px rgba(0,0,0,0.1);
      background-color: white;
    }

    .buttons {
      margin-top: 25px;
      display: flex;
      gap: 20px;
    }

    button {
      background: #0078d4;
      color: white;
      border: none;
      padding: 12px 25px;
      border-radius: 10px;
      font-size: 17px;
      cursor: pointer;
      transition: 0.3s;
      box-shadow: 0 3px 6px rgba(0,0,0,0.1);
    }

    button:hover {
      background: #005fa3;
      transform: scale(1.05);
    }

    footer {
      margin-top: 30px;
      color: #777;
      font-size: 14px;
    }


    /* =========================================================
   FOOTER GI.CODE — VERSION COMPACTE
========================================================= */

.gicode-footer {
    background: #071a2b;
    color: rgba(255,255,255,.75);
    margin-top: 40px;
}

/* Contenu principal */
.gicode-footer-container {
    max-width: 1200px;
    margin: auto;
    padding: 30px 25px;
    
    display: grid;
    grid-template-columns: 2fr 1fr 1fr 1.5fr;
    gap: 30px;
}

/* =========================
   IDENTITÉ
========================= */

.gicode-logo {
    font-size: 25px;
    font-weight: 800;
    color: white;
    margin-bottom: 8px;
}

.gicode-logo span {
    color: #d4af37;
}

.gicode-footer-brand p {
    max-width: 320px;
    margin: 5px 0;
    line-height: 1.5;
    font-size: 14px;
}

.gicode-slogan {
    color: #d4af37 !important;
    font-weight: 600;
}

/* =========================
   COLONNES
========================= */

.gicode-footer-column {
    display: flex;
    flex-direction: column;
    gap: 6px;
}

.gicode-footer-column h3 {
    color: white;
    font-size: 15px;
    margin: 0 0 7px;
}

.gicode-footer-column a {
    color: rgba(255,255,255,.65);
    text-decoration: none;
    font-size: 13px;
    transition: .3s ease;
}

.gicode-footer-column a:hover {
    color: #d4af37;
    transform: translateX(3px);
}

.gicode-footer-column p {
    margin: 2px 0;
    font-size: 13px;
}

/* =========================
   ICÔNES
========================= */

.gicode-footer-column i {
    width: 18px;
    color: #d4af37;
}

/* =========================
   RÉSEAUX SOCIAUX
========================= */

.gicode-social {
    display: flex;
    gap: 8px;
    margin-top: 8px;
}

.gicode-social a {
    width: 32px;
    height: 32px;
    border-radius: 50%;

    display: flex;
    align-items: center;
    justify-content: center;

    background: rgba(255,255,255,.08);
    color: white;

    transition: .3s ease;
}

.gicode-social a:hover {
    background: #d4af37;
    color: #071a2b;
    transform: translateY(-3px);
}

/* =========================
   BAS DU FOOTER
========================= */

.gicode-footer-bottom {
    max-width: 1200px;
    margin: auto;

    padding: 12px 25px;

    border-top: 1px solid rgba(255,255,255,.1);

    display: flex;
    justify-content: space-between;
    align-items: center;

    font-size: 12px;
}

.gicode-footer-bottom p {
    margin: 0;
}

.gicode-footer-bottom a {
    margin-left: 15px;
    color: rgba(255,255,255,.6);
    text-decoration: none;
}

.gicode-footer-bottom a:hover {
    color: #d4af37;
}

/* =========================
   RESPONSIVE
========================= */

@media (max-width: 900px) {

    .gicode-footer-container {
        grid-template-columns: repeat(2, 1fr);
        padding: 25px 20px;
    }

}

@media (max-width: 600px) {

    .gicode-footer-container {
        grid-template-columns: 1fr;
        gap: 20px;
        padding: 25px 20px;
    }

    .gicode-footer-bottom {
        flex-direction: column;
        align-items: flex-start;
        gap: 8px;
    }

    .gicode-footer-bottom a {
        margin-left: 0;
        margin-right: 12px;
    }

}
  </style>
</head>

<body>
  <header>
    <img src="https://i.ibb.co/27xRzqTQ/logo.png" alt="Gi.Code Logo" />
    <h1>🎙️ Gi.Code – Dictée vocale intelligente</h1>
  </header>

  <textarea id="texte" placeholder="Parlez ici ou saisissez du texte..."></textarea>

  <div class="buttons">
    <button id="start">🎧 Démarrer la dictée</button>
    <button id="stop">🛑 Arrêter</button>
    <button id="pdf">📄 Exporter en PDF</button>
  </div>

  <footer>© 2025 Gi.Code Formation – Bureautique & Développement</footer>

  <script>
    const { jsPDF } = window.jspdf;
    const startBtn = document.getElementById("start");
    const stopBtn = document.getElementById("stop");
    const pdfBtn = document.getElementById("pdf");
    const texte = document.getElementById("texte");

    // 🎤 Configuration de la reconnaissance vocale
    const SpeechRecognition = window.SpeechRecognition || window.webkitSpeechRecognition;
    const recognition = new SpeechRecognition();
    recognition.lang = "fr-FR";
    recognition.continuous = true;
    recognition.interimResults = false;

    recognition.onresult = (event) => {
      const transcript = event.results[event.results.length - 1][0].transcript;
      texte.value += transcript + " ";
    };

    recognition.onerror = (event) => {
      alert("Erreur de reconnaissance vocale : " + event.error);
    };

    startBtn.onclick = () => {
      recognition.start();
      startBtn.textContent = "🎧 En écoute...";
    };

    stopBtn.onclick = () => {
      recognition.stop();
      startBtn.textContent = "🎙️ Démarrer la dictée";
    };

    // 📄 Export PDF
    pdfBtn.onclick = () => {
      const doc = new jsPDF();
      doc.setFont("helvetica", "normal");
      const lines = doc.splitTextToSize(texte.value, 180);
      doc.text(lines, 15, 20);
      doc.save("GiCode_Dictee_Vocale.pdf");
    };
  </script>
</body>
</html>
