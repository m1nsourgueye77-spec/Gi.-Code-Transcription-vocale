<!DOCTYPE html>
<html lang="fr">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Gi.Code – Dictée vocale</title>
  <link rel="icon" href="https://i.ibb.co/27xRzqTQ/logo.png" />
  <script src="https://cdnjs.cloudflare.com/ajax/libs/jspdf/2.5.1/jspdf.umd.min.js"></script>
  <style>
    body {
      font-family: "Segoe UI", sans-serif;
      background: linear-gradient(135deg, #e9f0f7, #f5f7fa);
      margin: 0;
      padding: 0;
      display: flex;
      flex-direction: column;
      align-items: center;
      height: 100vh;
    }

    header {
      width: 100%;
      background: #0078d4;
      color: white;
      display: flex;
      align-items: center;
      justify-content: space-between;
      padding: 10px 40px;
      box-shadow: 0 4px 10px rgba(0,0,0,0.1);
    }

    header img {
      height: 50px;
      border-radius: 10px;
    }

    header h1 {
      font-size: 22px;
      font-weight: 600;
    }

    textarea {
      width: 85%;
      height: 400px;
      font-size: 18px;
      margin-top: 40px;
      border-radius: 12px;
      border: 2px solid #0078d4;
      padding: 15px;
      resize: none;
      outline: none;
      box-shadow: 0 4px 8px rgba(0,0,0,0.1);
      background-color: white;
    }

    .buttons {
      margin-top: 25px;
      display: flex;
      gap: 20px;
    }

    button {
      background: #0078d4;
      color: white;
      border: none;
      padding: 12px 25px;
      border-radius: 10px;
      font-size: 17px;
      cursor: pointer;
      transition: 0.3s;
      box-shadow: 0 3px 6px rgba(0,0,0,0.1);
    }

    button:hover {
      background: #005fa3;
      transform: scale(1.05);
    }

    footer {
      margin-top: 30px;
      color: #777;
      font-size: 14px;
    }
  </style>
</head>

<body>
  <header>
    <img src="https://i.ibb.co/27xRzqTQ/logo.png" alt="Gi.Code Logo" />
    <h1>🎙️ Gi.Code – Dictée vocale intelligente</h1>
  </header>

  <textarea id="texte" placeholder="Parlez ici ou saisissez du texte..."></textarea>

  <div class="buttons">
    <button id="start">🎧 Démarrer la dictée</button>
    <button id="stop">🛑 Arrêter</button>
    <button id="pdf">📄 Exporter en PDF</button>
  </div>

  <footer>© 2025 Gi.Code Formation – Bureautique & Développement</footer>

  <script>
    const { jsPDF } = window.jspdf;
    const startBtn = document.getElementById("start");
    const stopBtn = document.getElementById("stop");
    const pdfBtn = document.getElementById("pdf");
    const texte = document.getElementById("texte");

    // 🎤 Configuration de la reconnaissance vocale
    const SpeechRecognition = window.SpeechRecognition || window.webkitSpeechRecognition;
    const recognition = new SpeechRecognition();
    recognition.lang = "fr-FR";
    recognition.continuous = true;
    recognition.interimResults = false;

    recognition.onresult = (event) => {
      const transcript = event.results[event.results.length - 1][0].transcript;
      texte.value += transcript + " ";
    };

    recognition.onerror = (event) => {
      alert("Erreur de reconnaissance vocale : " + event.error);
    };

    startBtn.onclick = () => {
      recognition.start();
      startBtn.textContent = "🎧 En écoute...";
    };

    stopBtn.onclick = () => {
      recognition.stop();
      startBtn.textContent = "🎙️ Démarrer la dictée";
    };

    // 📄 Export PDF
    pdfBtn.onclick = () => {
      const doc = new jsPDF();
      doc.setFont("helvetica", "normal");
      const lines = doc.splitTextToSize(texte.value, 180);
      doc.text(lines, 15, 20);
      doc.save("GiCode_Dictee_Vocale.pdf");
    };
  </script>
</body>
</html>
